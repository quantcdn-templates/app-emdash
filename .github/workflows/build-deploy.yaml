# Build and deploy emdash CMS to Quant Cloud
#
# This template deploys as one environment inside the shared `templates`
# application in the quantcdn-templates org. Every template repo follows
# the same shape; see docs/superpowers/specs/2026-09-07-shared-cloud-app-design.md
# in the quant-templates workspace.
name: Build and Push emdash to Quant Cloud

on:
  push:
    branches:
      - main

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  QUANT_BASE_URL: ${{ vars.QUANT_BASE_URL || 'https://dashboard.quantcdn.io/api/v3' }}

jobs:
  build-and-push:
    runs-on: ${{ vars.RUNNER_TYPE || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Initialize Quant Cloud
        uses: quantcdn/quant-cloud-init-action@v4
        id: init
        with:
          quant_organization: ${{ secrets.QUANT_ORGANIZATION }}
          quant_api_key: ${{ secrets.QUANT_API_KEY }}
          quant_application: ${{ vars.QUANT_APPLICATION || 'templates' }}
          environment_name_override: ${{ github.event.repository.name }}
          base_url: ${{ env.QUANT_BASE_URL }}

      - name: Build and push emdash image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ vars.BUILD_PLATFORM || 'linux/amd64' }}
          push: true
          tags: |
            ${{ steps.init.outputs.stripped_endpoint }}/${{ secrets.QUANT_ORGANIZATION }}/${{ steps.init.outputs.quant_application }}:emdash-${{ steps.init.outputs.image_suffix_clean }}
          build-args: |
            NODE_VERSION=22
          cache-from: type=gha,scope=emdash
          cache-to: type=gha,mode=max,scope=emdash

      - name: Translate docker-compose for Quant Cloud
        uses: quantcdn/quant-cloud-compose-action@v1
        id: compose
        with:
          api_key: ${{ secrets.QUANT_API_KEY }}
          organization: ${{ secrets.QUANT_ORGANIZATION }}
          compose_file: docker-compose.yml
          image_suffix: ${{ steps.init.outputs.image_suffix_clean }}
          base_url: ${{ env.QUANT_BASE_URL }}

      - name: Create or update environment
        uses: quantcdn/quant-cloud-environment-action@v4
        with:
          api_key: ${{ secrets.QUANT_API_KEY }}
          organization: ${{ secrets.QUANT_ORGANIZATION }}
          app_name: ${{ steps.init.outputs.quant_application }}
          environment_name: ${{ steps.init.outputs.environment_name }}
          operation: ${{ steps.init.outputs.environment_exists == 'true' && 'update' || 'create' }}
          compose_spec: ${{ steps.compose.outputs.translated_compose }}
          base_url: ${{ env.QUANT_BASE_URL }}

      - name: Redeploy existing environment
        if: ${{ steps.init.outputs.environment_exists == 'true' }}
        uses: quantcdn/quant-cloud-environment-state-action@v4
        with:
          api_key: ${{ secrets.QUANT_API_KEY }}
          organization: ${{ secrets.QUANT_ORGANIZATION }}
          application: ${{ steps.init.outputs.quant_application }}
          environment: ${{ steps.init.outputs.environment_name }}
          action: redeploy
          base_url: ${{ env.QUANT_BASE_URL }}

      - name: Enable idle sleep
        env:
          QUANT_API_KEY: ${{ secrets.QUANT_API_KEY }}
          ORG: ${{ secrets.QUANT_ORGANIZATION }}
          APP: ${{ steps.init.outputs.quant_application }}
          ENVIRONMENT: ${{ steps.init.outputs.environment_name }}
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $QUANT_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"enabled": true, "idleMinutes": 30}' \
            "$QUANT_BASE_URL/organizations/$ORG/applications/$APP/environments/$ENVIRONMENT/idle-sleep"
